server:
  port: 8081
  host: 0.0.0.0

database:
  uri: sqlite://db.sqlite?mode=rwc
  enable_logging: true
  auto_migrate: true
  min_connections: 1
  max_connections: 10
  connect_timeout: 500
  idle_timeout: 500

auth:
  jwt:
    secret: development-secret-key-change-in-production
    expiration: 86400

logger:
  enable: true
  level: debug
  format: compact
  override_filter: null
