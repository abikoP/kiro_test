server:
  port: 3001
  host: 127.0.0.1

database:
  uri: "sqlite::memory:"
  enable_logging: false
  auto_migrate: true
  min_connections: 1
  max_connections: 1
  connect_timeout: 500
  idle_timeout: 500

auth:
  jwt:
    secret: test-secret-key
    expiration: 86400

logger:
  enable: false
  level: error
  format: compact
  override_filter: null
