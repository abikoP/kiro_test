[package]
name = "kiro_test"
version = "0.1.0"
edition = "2021"
description = "Telegraf設定ファイル管理システム"

[[bin]]
name = "seed_user"
path = "src/bin/seed_user.rs"

[[bin]]
name = "test_password"
path = "src/bin/test_password.rs"

[dependencies]
loco-rs = { version = "0.13", features = ["with-db", "auth_jwt", "cli"] }
sea-orm = { version = "1", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros"] }
migration = { path = "./migration" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
axum = "0.7"
tower-sessions = "0.13"

# 設定ファイル操作用
toml = "0.8"
url = "2.5"
thiserror = "1.0"

# 認証用
bcrypt = "0.15"

# HTMLエスケープ用
html-escape = "0.2"

# 時間処理用
time = "0.3"

[dev-dependencies]
serial_test = "3"
loco-rs = { version = "0.13", features = ["testing"] }
insta = { version = "1.34", features = ["redactions", "yaml", "filters"] }
