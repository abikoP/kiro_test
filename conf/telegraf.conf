[agent]
collection_jitter = "0s"
flush_interval = "10s"
flush_jitter = "0s"
interval = "10s"
metric_batch_size = 1000
metric_buffer_limit = 10000
round_interval = true

[[outputs.influxdb]]
database = "telegraf"
urls = ["http://localhost:8086"]

[[inputs.http_response]]
urls = [
    "https://example.com",
    "https://google.com",
    "https://github.com",
]
response_timeout = "5s"
method = "GET"
follow_redirects = true
