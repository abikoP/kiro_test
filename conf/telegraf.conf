# Telegraf Configuration Sample

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"

[[outputs.influxdb]]
  urls = ["http://localhost:8086"]
  database = "telegraf"

[[inputs.http_response]]
  urls = [
    "https://example.com",
    "https://google.com",
    "https://github.com"
  ]
  response_timeout = "5s"
  method = "GET"
  follow_redirects = true
